# Limiares da avaliação (F5-T04). `common` vale para qualquer configuração; leak_rate > 0 é sempre
# regressão. A secção `live` traz os mínimos do gate M1 (modelos reais no golden set da Aurora).
common:
  max_drop: 0.02 # queda máxima, face à baseline, nas métricas "quanto maior melhor"
live:
  floors:
    recall_at_5: 0.80
    answer_contains_rate: 0.75
  ceilings:
    fallback_rate: 0.10
    leak_rate: 0.0
