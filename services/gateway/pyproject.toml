[project]
name = "rag-gateway"
version = "0.0.0"
description = "Inference Gateway: autenticação, quotas, escolha de modelo e fallback (F6)"
requires-python = ">=3.12"
dependencies = [
    "rag-core[web]",
    "fastapi",
    "uvicorn",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_gateway"]
