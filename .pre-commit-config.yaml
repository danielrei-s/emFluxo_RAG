# Hooks locais: `make hooks` instala-os. Correr tudo: `uv run pre-commit run --all-files`.
exclude: '^(docs/(plan|spec)/|docs/PLANO_RAG_MULTINEGOCIO_v1\.md$|uv\.lock$|pnpm-lock\.yaml$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: "^fixtures/corpus/"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [json, yaml, ts, tsx, javascript, css]
