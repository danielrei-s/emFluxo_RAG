line-length = 100
target-version = "py312"
# Ferramentas do plano, fornecidas e geradas fora deste repositório.
extend-exclude = ["docs/plan/_ferramentas"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[lint.per-file-ignores]
# Nomes de erros fixados pelo contrato C6 (sem sufixo Error).
"packages/core/rag_core/errors.py" = ["N818"]
"**/tests/**" = ["S101", "S603", "S607"]
# Fixtures de BD de teste: credenciais descartáveis do contentor e SQL com nomes controlados.
"services/central-api/tests/**" = ["S106", "S608", "E501"]
"apps/local-engine/tests/**" = ["S105", "S106", "S603", "E501"]
# SQL com f-strings só interpola nomes de tabela constantes e marcadores "?" (nunca valores).
"packages/core/rag_core/stores/*.py" = ["S608"]
