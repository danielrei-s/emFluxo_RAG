[project]
name = "rag-cli"
version = "0.0.0"
description = "CLI rag: ingerir, perguntar e avaliar localmente (F5-T03)"
requires-python = ">=3.12"
dependencies = [
    "rag-core[lite]",
    "typer>=0.12",
]

[project.scripts]
rag = "rag_cli.main:app"

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_cli"]
