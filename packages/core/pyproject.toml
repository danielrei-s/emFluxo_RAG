[project]
name = "rag-core"
version = "0.0.0"
description = "Núcleo RAG: tipos, interfaces, ingestão, recuperação, geração"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings",
    "structlog",
    "httpx",
    "numpy",
    "rank-bm25",
    "pyyaml",
    "psutil",
    "langdetect",
    "jsonschema",
]

[project.optional-dependencies]
lite = ["olefile", "beautifulsoup4", "python-docx", "openpyxl", "python-pptx", "pdfplumber", "pypdfium2"]
ocr = ["rapidocr-onnxruntime", "pillow"]
docling = ["docling==2.151.1"]
onnx = ["fastembed", "tokenizers"]
st = ["sentence-transformers"]
web = ["fastapi"]
auth = ["pyjwt[crypto]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "hypothesis",
    "respx",
    "olefile",
    "pillow",
    "python-stdnum",
    "tokenizers",
    "fastapi",
    "pyjwt[crypto]",
    "beautifulsoup4",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "pdfplumber",
    "pypdfium2",
    "reportlab",
    "pypdf",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_core"]
