[project]
name = "rag-core"
version = "0.0.0"
description = "Núcleo RAG: tipos, interfaces, ingestão, recuperação, geração"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings",
    "structlog",
    "httpx",
    "numpy",
    "rank-bm25",
]

[project.optional-dependencies]
lite = []
ocr = []
docling = []
onnx = []
st = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "hypothesis",
    "respx",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_core"]
