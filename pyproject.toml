[project]
name = "emfluxo-rag"
version = "0.0.0"
description = "Plataforma RAG Multi-Negócio (raiz do workspace)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "services/gateway"]

[tool.uv.sources]
rag-core = { workspace = true }
rag-cli = { workspace = true }
rag-gateway = { workspace = true }

[dependency-groups]
dev = ["rag-core", "rag-cli", "rag-gateway", "pip-licenses", "pyyaml", "pre-commit", "reportlab", "python-docx", "openpyxl", "python-pptx", "pypdf", "Pillow"]

[tool.pytest.ini_options]
# O -m por omissão exclui os níveis pesados (C10); um -m na linha de comandos substitui-o.
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket -m 'not integration and not docker and not live and not slow and not docling and not ocr and not e2e'"
testpaths = ["packages/core/tests", "packages/cli/tests", "services/gateway/tests", "scripts/tests", "infra/tests"]
markers = [
    "integration: precisa de Postgres (testcontainers, pgvector/pgvector:pg17)",
    "docker: precisa do stack compose (nightly e manual)",
    "live: modelos ou serviços reais (Ollama, Supabase, HF); manual na Máquina 1",
    "slow: demora mais de 5 s (nightly)",
    "docling: perfil pesado Docling",
    "ocr: perfil pesado OCR",
    "posix_only: só corre em SO POSIX",
    "windows_only: só corre em Windows",
    "e2e: Playwright (nightly e antes de marcos)",
]

[tool.coverage.run]
# Corre só dentro do subprocesso do sandbox (o coverage não o mede lá).
omit = ["*/rag_core/testing/sandbox_parsers.py"]
