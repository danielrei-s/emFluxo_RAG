# Registo de modelos descarregáveis/embutidos (INV-22: revisão fixada + sha256 verificado antes
# de carregar). O schema completo (aliases de LLM, embeddings, rerankers) chega com F5-T02.
ocr_models:
  rapidocr:
    # Plano B da F3-T08: não há modelo de reconhecimento latino em ONNX com revisão e licença
    # verificadas; usa-se o conjunto embutido no wheel (PP-OCRv4 chinês/inglês). Reconhece mal
    # acentos portugueses (ver HR-27). Os ficheiros vivem em rapidocr_onnxruntime/ do site-packages.
    package: rapidocr-onnxruntime
    revision: "1.4.4" # versão do pacote que embute os modelos
    license: Apache-2.0
