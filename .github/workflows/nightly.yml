name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Instalar dependências (todos os extras)
        run: uv sync --all-packages --all-extras --frozen
      - name: Marcadores pesados (código 5 = nenhum teste, conta como sucesso)
        run: |
          code=0
          uv run pytest -m "slow or docling or ocr or docker or e2e" --allow-hosts=127.0.0.1,localhost || code=$?
          if [ "$code" -eq 5 ]; then code=0; fi
          exit "$code"
