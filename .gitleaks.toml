# Configuração do gitleaks: regras por omissão + exceções mínimas e documentadas.
title = "emFluxo RAG"

[extend]
useDefault = true

[allowlist]
description = "Ficheiros sem segredos reais e canários de teste (INV-03)"
regexes = [
  '''CANARIO-[A-Za-z0-9-]+''',
  '''HIDDEN-[A-Za-z0-9-]+''',
  '''PWNED-[A-Za-z0-9-]+''',
]
paths = [
  '''uv\.lock$''',
  '''pnpm-lock\.yaml$''',
]
