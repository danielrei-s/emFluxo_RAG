# Exemplo do registo de modelos (F5-T02). Copia para models.yaml; RAG_MODELS_FILE aponta para ele.
# A escolha final dos modelos fica na ADR-0009 (F5-T05); os valores abaixo são só um ponto de partida.
#
# Regras (validadas ao carregar):
#  - license: Apache-2.0, MIT ou BSD; Llama/Gemma só com `adr`; CC-BY-NC e "research only" são recusadas.
#  - files: se o modelo é descarregado por nós (ONNX, GGUF, safetensors), `revision` é obrigatória e
#    cada ficheiro leva o seu sha256, verificado antes de carregar (INV-22).
#  - base_url_env: nome da variável de ambiente com o URL do servidor (inclui /v1; loopback no modo offline).
models:
  rag-default:
    kind: llm
    backend: openai_compat
    base_url_env: RAG_OLLAMA_URL
    model: qwen2.5:7b-instruct
    license: Apache-2.0
  rag-embed:
    kind: embedding
    backend: openai_compat
    base_url_env: RAG_OLLAMA_URL
    model: bge-m3
    license: MIT
    dim: 1024
  # Exemplo de modelo descarregado (ONNX, com prefixos E5). Preencher revisão e hashes reais:
  # rag-embed-onnx:
  #   kind: embedding
  #   backend: fastembed
  #   model: intfloat/multilingual-e5-small
  #   license: MIT
  #   dim: 384
  #   query_prefix: "query: "
  #   document_prefix: "passage: "
  #   revision: <commit do Hugging Face>
  #   files:
  #     - {name: model.onnx, sha256: <64 hex>}
