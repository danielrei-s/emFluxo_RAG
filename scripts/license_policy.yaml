# Política de licenças (C4, INV-21). Lida por scripts/check_licenses.py.
#
# - Cada perfil lista os identificadores SPDX permitidos (depois de normalizados).
# - Expressões: "A OR B" passa se UMA alternativa for permitida; "A AND B" e "A; B"
#   (várias classifiers do pip-licenses) exigem TODAS permitidas. Expressões com
#   parênteses são rejeitadas, salvo exceção documentada.
# - Pacotes próprios (workspace) não são verificados.

profiles:
  # Tudo o que vai para o computador do cliente.
  shipped:
    allow: &shipped
      - MIT
      - MIT-0
      - BSD-2-Clause
      - BSD-3-Clause
      - Apache-2.0
      - ISC
      - Zlib
      - PSF-2.0
      - MPL-2.0
      - Unicode-3.0
      - Unicode-DFS-2016
      - CC0-1.0
      - 0BSD
      - HPND
      - MIT-CMU
      - CNRI-Python
      - BSL-1.0
      - Apache-2.0 WITH LLVM-exception

  # Gateway, central-api, worker, parser-sandbox: o mesmo mais LGPL (ex.: psycopg).
  server:
    allow: &server
      - *shipped
      - LGPL-2.1
      - LGPL-2.1-or-later
      - LGPL-3.0
      - LGPL-3.0-or-later

  # Dependências de desenvolvimento e CI: licenças OSI (ou equivalentes permissivas).
  dev:
    allow:
      - *server
      - BlueOak-1.0.0
      - Unlicense
      - EPL-1.0
      - EPL-2.0
      - GPL-2.0
      - GPL-2.0-or-later
      - GPL-3.0
      - GPL-3.0-or-later
      - AGPL-3.0
      - AGPL-3.0-or-later

# Licenças que merecem a mensagem "proibida" (qualquer perfil onde não estejam permitidas).
forbidden_patterns:
  - "(?i)^a?gpl"
  - "(?i)^lgpl"
  - "(?i)sspl"
  - "(?i)busl"
  - "(?i)cc-by-nc"
  - "(?i)commons.?clause"

# Pacotes do próprio projeto (padrões fnmatch, sem distinção de maiúsculas).
own_packages:
  - "rag-*"
  - "rag_*"
  - "emfluxo-rag"
  - "@rag/*"

# Nome devolvido pelos gestores de pacotes -> identificador SPDX (chaves em minúsculas).
normalize:
  "mit license": MIT
  "mit": MIT
  "bsd license": BSD-3-Clause
  "bsd": BSD-3-Clause
  "3-clause bsd license": BSD-3-Clause
  "apache 2.0 license": Apache-2.0
  "new bsd license": BSD-3-Clause
  "simplified bsd license": BSD-2-Clause
  "apache software license": Apache-2.0
  "apache 2.0": Apache-2.0
  "apache2.0": Apache-2.0
  "apache license 2.0": Apache-2.0
  "apache license, version 2.0": Apache-2.0
  "mozilla public license 2.0 (mpl 2.0)": MPL-2.0
  "isc license (iscl)": ISC
  "python software foundation license": PSF-2.0
  "python-2.0": PSF-2.0
  "the unlicense (unlicense)": Unlicense
  "gnu general public license v2 (gplv2)": GPL-2.0
  "gnu general public license v3 (gplv3)": GPL-3.0
  "gnu lesser general public license v2 or later (lgplv2+)": LGPL-2.1-or-later
  "gnu lesser general public license v3 (lgplv3)": LGPL-3.0
  "gnu lesser general public license v3 or later (lgplv3+)": LGPL-3.0-or-later
  "gnu affero general public license v3": AGPL-3.0
  "gnu affero general public license v3 or later (agplv3+)": AGPL-3.0-or-later

# Exceções documentadas: package ("nome" ou "nome==versão"), reason e adr são obrigatórios.
exceptions:
  - package: pypdfium2
    reason: >-
      Licença declarada "BSD-3-Clause OR Apache-2.0" mais o aviso "dependency licenses" das
      bibliotecas do pdfium embutidas (todas permissivas). Usado só pelo parser PDF lite
      (índice/bookmarks). Rever a lista completa ao preencher o perfil shipped (F11-T12).
    adr: "0006"
